[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "garment-nesting"
version = "0.1.0"
description = "Constrained garment pattern nesting with labelled SVG inputs and outputs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - internal development"}
dependencies = []

[project.optional-dependencies]
geometry = ["fonttools>=4.55,<5", "shapely>=2,<3"]
solver = ["packingsolver>=0.1.1301,<0.2"]
output = ["cairosvg>=2.7,<3", "Pillow>=10,<13", "resvg_py>=0.5,<0.6"]
app = ["nicegui>=3.19,<4"]
build = ["pyinstaller>=6.15,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
garment-nesting = "garment_nesting.cli:main"
garment-nesting-gui = "garment_nesting.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garment_nesting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
