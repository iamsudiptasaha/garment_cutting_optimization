name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,geometry,output,app]'
      - name: Install solver on Python 3.13
        if: matrix.python-version == '3.13'
        run: python -m pip install -e '.[solver]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Install Chromium acceptance-test tooling
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify SVG table rendering and input typography in Chromium
        if: matrix.python-version == '3.13'
        run: python scripts/ci/check-browser-gui.py
      - name: Upload GUI browser screenshot and diagnostics
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: gui-browser-acceptance-3.13
          path: browser-test-results/
          if-no-files-found: ignore
      - name: Generate reference geometry report
        if: always()
        run: |
          garment-nesting verify samples/FC_HH_Full_Pyjama.svg --output geometry-verification.json || true
      - name: Upload reference geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-verification-${{ matrix.python-version }}
          path: geometry-verification.json
          if-no-files-found: error
