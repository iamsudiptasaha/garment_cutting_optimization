name: Desktop Builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native engine, GUI and packager
        run: python -m pip install -e ".[geometry,solver,output,app,build]"
      - name: Verify native engine and GUI imports
        run: python -m garment_nesting.app smoke
      - name: Build installable desktop bundle
        run: python scripts/ci/build_desktop.py --target ${{ matrix.target }}
      - name: Smoke test bundled executable
        run: python scripts/ci/check_desktop.py --target ${{ matrix.target }}
      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: NestingOptimizer-${{ matrix.target }}
          path: release/NestingOptimizer-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30
